<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>410 棒子</title>
<style>
  :root {
    --bg: #f3f3f5;
    --surface: #ffffff;
    --border: #e6e6e9;
    --text: #1c1c1e;
    --text-2: #6b6b70;
    --text-3: #9a9aa0;
    --accent: #0a84ff;
    --ok: #1f9d55;
    --warn: #c2751a;
    --danger: #d1242f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
  h1 { font-size: 26px; font-weight: 500; margin: 0; letter-spacing: -.02em; }
  .meta { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .status-block { text-align: right; flex-shrink: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; padding: 5px 13px; border-radius: 999px;
    background: #ebebee; color: var(--text-2); white-space: nowrap;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.on { background: #e7f6ec; color: var(--ok); }
  .pill.on i { animation: breathe 2.4s ease-in-out infinite; }
  .pill.off { background: #fdecee; color: var(--danger); }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .updated { font-size: 11px; color: var(--text-3); margin-top: 6px; }

  .chain {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .node { display: flex; flex-direction: column; gap: 1px; }
  .node b { font-weight: 500; font-size: 13px; }
  .node span { font-size: 11px; color: var(--text-3); }
  .link { flex: 1 1 20px; min-width: 20px; height: 1px; background: var(--border); position: relative; }
  .link::after {
    content: ''; position: absolute; right: 0; top: -2.5px;
    border-left: 5px solid var(--border); border-top: 3px solid transparent; border-bottom: 3px solid transparent;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
        transition: border-color .18s ease;
  }
  .card:hover { border-color: #d6d6db; }
  .card-head { display: flex; align-items: center; gap: 7px; color: var(--text-3); font-size: 12px; margin-bottom: 10px; }
  .card-head svg { flex-shrink: 0; }
  .card-value { font-size: 21px; font-weight: 500; line-height: 1.25; letter-spacing: -.01em; }
  .card-value small { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
  .card-note { font-size: 11.5px; color: var(--text-2); margin-top: 5px; }
  .card-note.ok { color: var(--ok); }
  .card-note.warn { color: var(--warn); }
  .card-note.bad { color: var(--danger); }

  .bar { height: 5px; border-radius: 3px; background: #ededf0; overflow: hidden; margin-top: 9px; }
  .bar > div { height: 100%; border-radius: 3px; background: var(--ok); transition: width .35s ease, background .35s ease; }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h2 { font-size: 14px; font-weight: 500; margin: 0; }
  .panel-sub { font-size: 11.5px; color: var(--text-3); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, input[type=password], input[type=number] {
    padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px;
    font-size: 13px; background: #fbfbfc; color: var(--text); outline: none;
    transition: border-color .15s, background .15s;
  }
  select:focus, input:focus { border-color: var(--accent); background: #fff; }
  select { min-width: 230px; flex: 1 1 230px; }
  input[type=password] { min-width: 150px; flex: 1 1 150px; }
  button {
    padding: 8px 15px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: #f5f5f7; border-color: #d6d6db; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  button.primary:hover:not(:disabled) { background: #333336; border-color: #333336; }
  button.danger { color: var(--danger); border-color: #f0c9cc; }
  button.danger:hover:not(:disabled) { background: #fdecee; border-color: #e7b3b7; }

  .hint { font-size: 11.5px; color: var(--text-3); margin-top: 10px; }

  pre {
    margin: 0; padding: 14px 16px; background: #1b1b1d; border-radius: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.85; color: #b9b9c0; overflow-x: auto;
    max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
  }
  pre .t { color: #6e6e78; }

  #toast {
    position: fixed; right: 24px; bottom: 24px; z-index: 99;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    background: #1c1c1e; color: #fff; font-size: 12.5px; padding: 10px 16px;
    border-radius: 10px; opacity: 0; transform: translateY(8px);
    transition: opacity .22s ease, transform .22s ease; max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: #8f1d24; }

  @media (max-width: 560px) {
    body { padding: 20px 14px 48px; }
    h1 { font-size: 22px; }
    .top { flex-direction: column; }
    .status-block { text-align: left; }
    .link { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow">USB 4G Relay</div>
      <h1>410 棒子</h1>
      <div class="meta" id="sub">连接中…</div>
    </div>
    <div class="status-block">
      <span class="pill" id="badge"><i></i>检测中</span>
      <div class="updated" id="updated">—</div>
    </div>
  </header>

  <div class="chain" id="chain">
    <span style="color:var(--text-3);font-size:12px;">正在读取链路…</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-head">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.8a15.5 15.5 0 0 1 20 0"/><path d="M5.5 12.4a10.5 10.5 0 0 1 13 0"/><path d="M9 16a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="19.3" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span>中继</span>
      </div>
      <div class="card-value" id="c-conn">—</div>
      <div class="card-note" id="c-conn-note">—</div>
      <div class="card-note" id="c-wan-note">—</div>
    </div>

    <div class="card">
      <div class="card-head">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20V7"/></svg>
        <span>信号</span>
      </div>
      <div class="card-value" id="c-signal">—</div>
      <div class="bar"><div id="c-bar" style="width:0%"></div></div>
      <div class="card-note" id="c-signal-note">—</div>
    </div>

    <div class="card">
      <div class="card-head">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7v10"/></svg>
        <span>内存</span>
      </div>
      <div class="card-value" id="c-mem">—</div>
      <div class="bar"><div id="c-mem-bar" style="width:0%"></div></div>
      <div class="card-note" id="c-swap">—</div>
    </div>

    <div class="card">
      <div class="card-head">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>
        <span>温度</span>
      </div>
      <div class="card-value" id="c-temp">—</div>
      <div class="card-note" id="c-uptime">—</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>手动选择中继</h2>
      <span class="panel-sub" id="scan-sub">未扫描</span>
    </div>
    <div class="row">
      <button onclick="scan()" id="btn-scan">扫描附近 WiFi</button>
      <select id="ssidList"><option value="">先点扫描</option></select>
      <input id="pwd" type="password" placeholder="密码（新网络必填）" autocomplete="off">
      <button class="primary" onclick="doConnect()" id="btn-conn">连接</button>
    </div>
    <div class="hint">已保存过的网络留空密码直接连；新网络需要密码，连上后自动保存。</div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>日志与维护</h2>
      <span class="panel-sub" id="journal-sub">—</span>
    </div>
    <div class="row">
      <button onclick="cleanLogs()" id="btn-clean">清理 2 天前日志</button>
      <button onclick="doStickReconnect()" id="btn-reconnect">重连棒子 WiFi</button>
      <button onclick="hotspot(true)" id="btn-hot-on">开启热点</button>
      <button onclick="hotspot(false)" id="btn-hot-off">关闭热点</button>
      <button class="danger" onclick="doReboot()" id="btn-reboot">重启棒子</button>
    </div>
    <div class="hint" id="hot-note">热点开启后 wlan0 停止中继，仅供临时救援。</div>
    <div class="hint">「重连棒子 WiFi」会扫描一次，只连信号最强且已保存密码的网络；扫不到就停下，不会反复重试。</div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>NetworkManager</h2>
      <span class="panel-sub">最近 25 行</span>
    </div>
    <pre id="log">加载中…</pre>
  </div>

</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let savedSet = new Set();

function toast(text, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = text;
  $('toast').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function fmtUptime(s) {
  s = Math.round(s || 0);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d > 0) return `${d} 天 ${h} 小时`;
  if (h > 0) return `${h} 小时 ${m} 分`;
  return `${m} 分钟`;
}

function signalWord(v) {
  if (v >= 75) return '优秀';
  if (v >= 60) return '良好';
  if (v >= 45) return '一般';
  if (v > 0) return '较弱';
  return '无信号';
}

function signalColor(v) {
  if (v >= 60) return 'var(--ok)';
  if (v >= 45) return 'var(--warn)';
  return 'var(--danger)';
}

function clock() {
  const d = new Date();
  return d.toTimeString().slice(0, 8);
}

async function loadStatus() {
  try {
    const d = await (await fetch('/api/status')).json();
    const badge = $('badge');

    if (!d.online) {
      badge.className = 'pill off';
      badge.innerHTML = '<i></i>离线';
      $('sub').textContent = d.error || 'SSH 不可达';
      $('updated').textContent = '更新于 ' + clock();
      $('c-conn').textContent = '—';
      $('c-conn-note').textContent = '棒子不可达';
      $('c-conn-note').className = 'card-note warn';
      $('c-wan-note').textContent = '—';
      $('c-wan-note').className = 'card-note';
      return;
    }

    badge.className = 'pill on';
    badge.innerHTML = '<i></i>在线';
    $('sub').textContent = `${d.os || ''} · 内核 ${d.kernel || ''}`;
    $('updated').textContent = '更新于 ' + clock();
    $('journal-sub').textContent = `日志占用 ${d.journal || '—'} · 保留 ${d.journal_retention || '—'}`;

    savedSet = new Set(d.saved || []);

    const isHotspot = d.wlan_state === 'connected' && d.wlan_conn === 'WIFI';
    const relayOn = d.wlan_state === 'connected' && !isHotspot;

    $('c-conn').textContent = isHotspot ? '热点模式' : (relayOn ? d.wlan_conn : '未连接');
    $('c-conn-note').textContent = d.wlan_ip ? d.wlan_ip : '无地址';
    $('c-conn-note').className = 'card-note' + (relayOn ? ' ok' : (isHotspot ? ' warn' : ''));

    const wanMap = {
      ok:       ['外网可达', 'ok'],
      dns_fail: ['链路通但 DNS 异常', 'warn'],
      down:     ['外网不可达', 'bad'],
      skip:     ['未中继，未测外网', '']
    };
    const wan = wanMap[d.wan_status] || ['—', ''];
    $('c-wan-note').textContent = wan[0];
    $('c-wan-note').className = 'card-note ' + wan[1];

    const sig = d.signal || 0;
    $('c-signal').innerHTML = sig > 0 ? `${sig}<small>/100</small>` : '—';
    $('c-bar').style.width = sig + '%';
    $('c-bar').style.background = signalColor(sig);
    $('c-signal-note').textContent = signalWord(sig);

    const memPct = d.mem_total_mb ? Math.round(d.mem_used_mb / d.mem_total_mb * 100) : 0;
    $('c-mem').innerHTML = `${d.mem_used_mb}<small>/ ${d.mem_total_mb} MB</small>`;
    $('c-mem-bar').style.width = memPct + '%';
    $('c-mem-bar').style.background = memPct > 85 ? 'var(--danger)' : (memPct > 70 ? 'var(--warn)' : 'var(--accent)');
    $('c-swap').textContent = `swap ${d.swap_used_mb} / ${d.swap_total_mb} MB`;

    $('c-temp').innerHTML = `${d.temp_c}<small>°C</small>`;
    $('c-uptime').textContent = `已运行 ${fmtUptime(d.uptime)}`;

    $('chain').innerHTML = `
      <div class="node"><b>飞牛</b><span>${d.usb_ip || 'usb0'}</span></div>
      <div class="link"></div>
      <div class="node"><b>棒子</b><span>wlan0</span></div>
      <div class="link"></div>
      <div class="node"><b>${relayOn ? d.wlan_conn : (isHotspot ? '热点' : '未中继')}</b><span>${sig > 0 ? sig + '/100' : '—'}</span></div>
      <div class="link"></div>
      <div class="node"><b>4G</b><span>${d.modem ? '模组在位' : '无模组'}</span></div>
      <div class="link"></div>
      <div class="node"><b>外网</b><span>&nbsp;</span></div>`;

    $('hot-note').textContent = d.ap_autoconnect === 'no'
      ? '热点自动启动已禁用，需手动开启。'
      : '热点自动启动仍开启，可能在断连时抢占 wlan0。';
  } catch (e) {
    $('badge').className = 'pill off';
    $('badge').innerHTML = '<i></i>错误';
    $('sub').textContent = String(e);
  }
}

async function loadLogs() {
  try {
    const d = await (await fetch('/api/logs')).json();
    const box = $('log');
    if (!d.ok || !d.lines.length) { box.textContent = '暂无日志'; return; }
    box.textContent = '';
    d.lines.slice(-25).forEach(line => {
      const div = document.createElement('div');
      const m = line.match(/^(\S+\s+\S+\s+[\d:]+)\s+(.*)$/);
      if (m) {
        div.innerHTML = `<span class="t">${m[1].slice(-8)}</span>  ${m[2]}`;
      } else {
        div.textContent = line;
      }
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    $('log').textContent = '读取失败：' + e;
  }
}

async function scan() {
  const btn = $('btn-scan');
  btn.disabled = true;
  btn.textContent = '扫描中…';
  try {
    const d = await (await fetch('/api/scan')).json();
    if (!d.ok) { toast('扫描失败：' + (d.error || ''), true); return; }
    const sel = $('ssidList');
    sel.innerHTML = '';
    if (!d.networks.length) {
      sel.innerHTML = '<option value="">未发现网络</option>';
      $('scan-sub').textContent = '0 个网络';
      return;
    }
    for (const n of d.networks) {
      const opt = document.createElement('option');
      opt.value = n.ssid;
      const mark = savedSet.has(n.ssid) ? ' · 已保存' : '';
      opt.textContent = `${n.ssid}   ${n.signal}/100   ${n.security === 'open' ? '开放' : n.security}${mark}`;
      sel.appendChild(opt);
    }
    $('scan-sub').textContent = `${d.networks.length} 个网络`;
    toast(`发现 ${d.networks.length} 个网络`);
  } catch (e) {
    toast('扫描失败：' + e, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '扫描附近 WiFi';
  }
}

async function doConnect() {
  const ssid = $('ssidList').value;
  const pwd = $('pwd').value;
  if (!ssid) { toast('请先扫描并选择网络', true); return; }
  const btn = $('btn-conn');
  btn.disabled = true;
  btn.textContent = '连接中…';
  toast('正在连接 ' + ssid + '，最长约 45 秒');
  try {
    const d = await (await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ssid, password: pwd })
    })).json();
    if (d.ok) {
      toast('已连接到 ' + ssid);
      $('pwd').value = '';
      setTimeout(loadStatus, 1500);
    } else {
      toast('连接失败：' + (d.output || d.error || '未知错误'), true);
    }
  } catch (e) {
    toast('请求失败：' + e, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '连接';
  }
}

async function cleanLogs() {
  const btn = $('btn-clean');
  btn.disabled = true;
  btn.textContent = '清理中…';
  try {
    const d = await (await fetch('/api/cleanlogs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ days: 2 })
    })).json();
    if (d.ok) {
      toast(`已清理 2 天前日志：${d.before} → ${d.after}`);
      setTimeout(() => { loadStatus(); loadLogs(); }, 800);
    } else {
      toast('清理失败：' + (d.error || ''), true);
    }
  } catch (e) {
    toast('请求失败：' + e, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '清理 2 天前日志';
  }
}

async function hotspot(enable) {
  const btn = enable ? $('btn-hot-on') : $('btn-hot-off');
  btn.disabled = true;
  try {
    const d = await (await fetch('/api/hotspot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enable })
    })).json();
    toast(d.ok ? (enable ? '热点已开启，wlan0 停止中继' : '热点已关闭') : ('操作失败：' + (d.error || '')), !d.ok);
    setTimeout(loadStatus, 1500);
  } catch (e) {
    toast('请求失败：' + e, true);
  } finally {
    btn.disabled = false;
  }
}

async function doStickReconnect() {
  const btn = $('btn-reconnect');
  btn.disabled = true;
  btn.textContent = '重连中…';
  toast('正在扫描并连接已保存的 WiFi，最长约 90 秒');
  try {
    const d = await (await fetch('/api/stick-reconnect', { method: 'POST' })).json();
    toast(d.message || (d.ok ? '重连成功' : '重连失败'), !d.ok);
    setTimeout(loadStatus, 1500);
  } catch (e) {
    toast('请求失败：' + e, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '重连棒子 WiFi';
  }
}

async function doReboot() {
  if (!confirm('重启后棒子断开约 40 秒，飞牛的备份链路会中断。确认重启？')) return;
  try {
    await fetch('/api/reboot', { method: 'POST' });
    toast('重启指令已下发，约 40 秒后恢复');
    setTimeout(loadStatus, 8000);
  } catch (e) {
    toast('请求失败：' + e, true);
  }
}

loadStatus();
loadLogs();
setInterval(loadStatus, 5000);
setInterval(loadLogs, 15000);
</script>
